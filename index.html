<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOS TOPUP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#f2f6ff;padding-bottom:80px}
.head{background:#fff;display:flex;justify-content:space-between;padding:12px;box-shadow:0 2px 10px #0001;position:sticky;top:0;z-index:10}
.logo{font-weight:900;color:#0a3fff;font-size:20px}.login{background:#0a3fff;color:#fff;border:none;padding:8px 14px;border-radius:8px}
.page{display:none;padding:10px}.page.on{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px #0001;cursor:pointer}
.card img{width:100%;height:110px;object-fit:cover}.card p{text-align:center;padding:8px;font-weight:700;font-size:12px}
.title{font-weight:900;text-align:center;margin:14px 0;color:#102a6b}
.rech{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rech label{background:#fff;border:2px solid #e6ebff;border-radius:10px;padding:12px;display:flex;align-items:center;justify-content:space-between;font-size:13px;cursor:pointer}
.rech label.on{border-color:#0a3fff;background:#eef3ff}
.rech b{color:#ff6a00;font-weight:900}
.box{background:#fff;border-radius:12px;padding:12px;margin-top:12px;box-shadow:0 2px 8px #0001}
.input{width:100%;padding:12px;border:2px solid #dce6ff;border-radius:10px;margin-top:8px}
.btn{width:100%;padding:12px;background:#0a3fff;color:#fff;border:none;border-radius:10px;font-weight:800;margin-top:10px}
.pay{border:2px solid #eee;border-radius:10px;padding:10px;margin-top:8px;display:flex;justify-content:space-between;cursor:pointer}
.pay.on{border-color:#0a3fff;background:#eef3ff}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid #ddd}
</style></head><body>
<div class="head"><div class="logo">SOS TOPUP</div><button class="login">Login</button></div>

<div id="home" class="page on">
<div class="title">BONUS OFFER</div>
<div class="grid">
<div class="card" onclick="openTopup('bonus')"><img src="https://via.placeholder.com/300/0a3fff/fff?text=PREMIUM"><p>PREMIUM USER</p></div>
<div class="card" onclick="openTopup('bonus')"><img src="https://via.placeholder.com/300/0066ff/fff?text=FRIDAY"><p>FRIDAY OFFER</p></div>
</div>
<div class="title">GAMES TOPUP</div>
<div class="grid">
<div class="card" onclick="openTopup('diamond')"><img src="https://via.placeholder.com/300/ff3b30/fff?text=DIAMOND"><p>Uid TopUp (BD)</p></div>
<div class="card" onclick="openTopup('weekly')"><img src="https://via.placeholder.com/300/f5a623/fff?text=WEEKLY+LITE"><p>Weekly Lite (BD)</p></div>
<div class="card" onclick="openTopup('weeklymonthly')"><img src="https://via.placeholder.com/300/8b5cf6/fff?text=WEEKLY/MONTHLY"><p>Weekly/Monthly</p></div>
<div class="card" onclick="openTopup('level')"><img src="https://via.placeholder.com/300/10b981/fff?text=LEVEL+UP"><p>Level Up Pass</p></div>
</div>
</div>

<div id="topup" class="page">
<button onclick="goHome()" style="background:#eee;border:none;padding:6px 12px;border-radius:20px">← Back</button>
<div class="box" style="display:flex;gap:10px;align-items:center;margin-top:8px">
