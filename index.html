<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOS TOPUP - AI Auto Bot</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#080a12;color:#fff}
.header{background:#ff0033;padding:15px;text-align:center;font-size:26px;font-weight:900}
.bot-box{position:fixed;bottom:0;left:0;right:0;max-width:500px;margin:auto;background:#14182a;border-radius:20px 20px 0 0;height:85vh;display:flex;flex-direction:column;border:1px solid #ff0033}
.chat{flex:1;overflow-y:auto;padding:15px}
.msg{padding:10px 14px;border-radius:14px;margin:8px 0;max-width:80%}

.top-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:15px}
.card{background:#1a2040;border:1px solid #2a3560;border-radius:12px;padding:12px;text-align:center;cursor:pointer}
